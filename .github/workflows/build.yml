name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift run SwitcherCoreSelfTest

      - name: Build app
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x scripts/*.sh
          scripts/build_app.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Location-Switcher
          path: dist/*.zip

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release already exists; preserving its reviewed assets."
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip --generate-notes
          fi
